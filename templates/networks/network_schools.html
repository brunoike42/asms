<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }} - Schools - ASMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body { background: #f4f6f9; } .asms-hero { background: #1B3A6B; color: #fff; }</style>
</head>
<body>

<div class="asms-hero py-4 mb-4">
  <div class="container">
    <h1 class="h4 mb-0">{{ network.name }}</h1>
    <div class="mt-2"><a href="{% url 'network_admin:dashboard' %}" class="text-white-50 small">&larr; All networks</a></div>
  </div>
</div>

<div class="container pb-5">
  {% include 'networks/_network_nav.html' %}

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table mb-0 align-middle">
        <thead><tr><th class="ps-3">School</th></tr></thead>
        <tbody>
          {% for school in schools %}
          <tr><td class="ps-3">{{ school.name }}</td></tr>
          {% empty %}
          <tr><td class="text-center text-muted py-4">No schools in this network yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
