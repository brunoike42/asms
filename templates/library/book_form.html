{% extends "base/base.html" %}{% block title %}Add Book{% endblock %}{% block page_title %}Add Book to Catalogue{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-header"><i class="bi bi-book-fill me-2 text-primary"></i>Book Details</div>
<div class="card-body"><form method="post">{% csrf_token %}
  <div class="row g-3">
    <div class="col-12"><label class="form-label fw-semibold">Title *</label><input type="text" name="title" class="form-control" required></div>
    <div class="col-md-8"><label class="form-label fw-semibold">Author *</label><input type="text" name="author" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label fw-semibold">ISBN</label><input type="text" name="isbn" class="form-control"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Publisher</label><input type="text" name="publisher" class="form-control"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Category</label>
    <select name="category" class="form-select"><option value="">— Select —</option>{% for c in categories %}<option value="{{ c.pk }}">{{ c }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Edition</label><input type="text" name="edition" class="form-control" placeholder="e.g. 3rd"></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Year Published</label><input type="number" name="year_published" class="form-control" min="1800" max="2030"></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Copies</label><input type="number" name="total_copies" class="form-control" value="1" min="1"></div>
    <div class="col-12"><label class="form-label fw-semibold">Shelf Location</label><input type="text" name="location" class="form-control" placeholder="e.g. Shelf A3, Row 2"></div>
    <div class="col-12"><label class="form-label fw-semibold">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
    <div class="col-12 d-flex gap-2"><button type="submit" class="btn btn-primary">Add to Catalogue</button><a href="{% url 'book_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
  </div>
</form></div></div></div></div>{% endblock %}
