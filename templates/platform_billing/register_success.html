<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f6f9; }
  .asms-hero { background: #1B3A6B; color: #fff; }
</style>
</head>
<body>

<div class="asms-hero py-4 mb-4">
  <div class="container text-center"><h1 class="h3 mb-0">ASMS</h1></div>
</div>

<div class="container text-center pb-5" style="max-width: 560px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h2 class="h4 mb-3">{{ tenant.name }} is live 🎉</h2>
      <p class="text-muted">
        Your trial is running. We've emailed your login link to your account email as well.
      </p>
      <a href="{{ portal_url }}" class="btn btn-lg w-100 text-white mt-3" style="background:#0A7B8C;">
        Go to {{ tenant.name }}'s dashboard
      </a>
      <p class="small text-muted mt-3 mb-0">{{ portal_url }}</p>
    </div>
  </div>
</div>

</body>
</html>
