{% extends "base/base.html" %}{% block title %}Apply Leave{% endblock %}{% block page_title %}Apply for Leave{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card"><div class="card-header"><i class="bi bi-calendar-x me-2 text-primary"></i>Leave Application</div>
<div class="card-body"><form method="post">{% csrf_token %}
  <div class="mb-3"><label class="form-label fw-semibold">Leave Type</label>
  <select name="leave_type" class="form-select" required>{% for lt in leave_types %}<option value="{{ lt.pk }}">{{ lt.name }} ({{ lt.days_allowed }} days allowed)</option>{% endfor %}</select></div>
  <div class="mb-3"><label class="form-label fw-semibold">Start Date</label><input type="date" name="start_date" class="form-control" required></div>
  <div class="mb-3"><label class="form-label fw-semibold">End Date</label><input type="date" name="end_date" class="form-control" required></div>
  <div class="mb-3"><label class="form-label fw-semibold">Reason</label><textarea name="reason" class="form-control" rows="3" required placeholder="Briefly explain the reason for leave..."></textarea></div>
  <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Submit Application</button><a href="{% url 'leave_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div></div></div></div>{% endblock %}
