{% extends "base/base.html" %}{% block title %}Add CPD{% endblock %}{% block page_title %}Add CPD Record{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-header"><i class="bi bi-award me-2 text-primary"></i>CPD Training Record</div>
<div class="card-body"><form method="post">{% csrf_token %}
  <div class="row g-3">
    <div class="col-md-12"><label class="form-label fw-semibold">Staff Member</label>
    <select name="staff" class="form-select" required><option value="">Select staff...</option>{% for s in all_staff %}<option value="{{ s.pk }}">{{ s.user.get_full_name }}</option>{% endfor %}</select></div>
    <div class="col-12"><label class="form-label fw-semibold">Training Title</label><input type="text" name="title" class="form-control" required placeholder="e.g. Inclusive Education Workshop"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Institution / Organiser</label><input type="text" name="institution" class="form-control"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Type</label>
    <select name="cpd_type" class="form-select">{% for v,l in cpd_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Start Date</label><input type="date" name="start_date" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label fw-semibold">End Date</label><input type="date" name="end_date" class="form-control"></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Hours</label><input type="number" name="hours" class="form-control" value="8" min="0" step="0.5"></div>
    <div class="col-12"><label class="form-label fw-semibold">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    <div class="col-12 d-flex gap-2"><button type="submit" class="btn btn-primary">Save CPD Record</button><a href="{% url 'cpd_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
  </div>
</form></div></div></div></div>{% endblock %}
